<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify an Ace certificate</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--text:#14211b;--muted:#5a6b62;--primary:#0b6b3a;--border:#d8e3dc;--bad:#a12b2b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#16221b;--text:#e8f2ec;--muted:#9bb0a5;--primary:#5fd18f;--border:#27382e;--bad:#ff8c8c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px 16px}
.wrap{max-width:640px;margin:0 auto}h1{font-size:20px;margin:0 0 4px}p{color:var(--muted)}
form{display:flex;gap:8px;margin:16px 0}input{flex:1;min-width:0;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font:inherit;letter-spacing:.1em;text-transform:uppercase}
button{border:0;border-radius:10px;background:var(--primary);color:#fff;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
.cert{background:var(--card);border:2px solid var(--primary);border-radius:16px;padding:32px 20px;text-align:center}
.cert .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.cert h2{font-size:26px;margin:6px 0}.cert .name{font-size:28px;font-weight:800;margin:14px 0}
.ok{color:var(--primary);font-weight:700}.no{color:var(--bad);font-weight:700}.small{font-size:13px;color:var(--muted);margin-top:18px}
@media print{body{background:#fff;color:#000}form,.noprint{display:none}.cert{border-color:#000}}
</style></head><body><div class="wrap">
<h1>Ace Education: certificate check</h1><p>Enter the code printed on a certificate to confirm it is genuine.</p>
<form id="f"><input id="c" maxlength="20" placeholder="CERTIFICATE CODE" autocomplete="off" aria-label="Certificate code"><button>Check</button></form>
<div id="out" aria-live="polite"></div></div>
<script src="../config.js"></script>
<script>
(function(){
  var cfg=window.ACE_CONFIG||{},out=document.getElementById('out'),inp=document.getElementById('c');
  function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
  function show(h){out.innerHTML=h}
  function check(code){
    code=(code||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase(); if(code.length<8)return show('<p class="no">Enter the full code.</p>');
    if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)return show('<p class="no">This page is not connected yet.</p>');
    show('<p>Checking…</p>');
    fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/verify_certificate',{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+cfg.supabaseAnonKey},body:JSON.stringify({p_code:code})})
    .then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){
      if(!rows||!rows.length)return show('<p class="no">No certificate matches that code. Check for typing mistakes.</p>');
      var c=rows[0],d=String(c.issued_at).slice(0,10);
      show('<div class="cert"><div class="k">Ace Education</div><h2>Certificate of completion</h2><div class="k">This certifies that</div><div class="name">'+esc(c.holder_name)+'</div><div class="k">completed and passed</div><h2>'+esc(c.course_title)+'</h2><div>Score '+esc(c.score)+'% • Issued '+esc(d)+'</div><p class="ok">✔ Verified</p><div class="small">Code '+esc(code)+'. This certificate shows course completion on Ace Education. It is not an accredited qualification.</div></div><p class="noprint"><button onclick="window.print()">Print or save as PDF</button></p>');
    }).catch(function(){show('<p class="no">Could not check right now. Try again.</p>')});
  }
  document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();check(inp.value)});
  var q=new URLSearchParams(location.search).get('code'); if(q){inp.value=q;check(q)}
})();
</script></body></html>
