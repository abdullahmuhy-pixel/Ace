<title>Ace Education: student app</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F7F9FC;--surface:#fff;--tint:#EEF3FA;--text:#0F172A;--text2:rgba(15,23,42,.68);--text3:rgba(15,23,42,.45);--border:#E3E9F2;--ink:var(--primary-dark);--green:#15803D;--red:#B91C1C;--gold:#B45309}

[data-country="GH"]{--primary:#006B3F;--primary-dark:#00472A;--accent:#CE1126}

body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:720px;margin:0 auto;min-height:100dvh;background:var(--bg);padding-bottom:84px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border)}

.ib{width:36px;height:36px;border:0;border-radius:var(--r,10px);background:var(--tint);font-size:15px}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tl{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:8px 2px;text-align:center}
.tl b{display:block;font:700 22px 'JetBrains Mono',monospace}.tl i{font-style:normal;font-size:11px;opacity:.85}
.pad{padding:14px 14px 0}
.ban{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:14px;padding:14px;color:#fff;text-align:left;background:linear-gradient(135deg,var(--primary),var(--primary-dark))}
.ban .ic{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:20px}
.ban b{display:block;font-size:15px}.ban span{font-size:12px;opacity:.85}.ban em{margin-left:auto;font-style:normal;font-size:20px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.bt{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 6px;font-weight:600;font-size:13px}
.full{grid-column:1/-1}

.goal{display:flex;align-items:center;gap:12px}.goal b{display:block;font-size:15px}.goal span{color:var(--text2);font-size:12px}
.btn{margin-left:auto;border:0;border-radius:99px;background:var(--primary-dark);color:#fff;padding:9px 16px;font-weight:700;font-size:13px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{border:0;border-radius:14px;color:#fff;text-align:left;padding:14px 12px 12px;position:relative}
.sc .e{font-size:24px;display:block}.sc b{display:block;margin-top:6px;font-size:14px}.sc span{font-size:11px;opacity:.85}
.sc .tag{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;background:rgba(0,0,0,.28);border-radius:5px;padding:1px 6px}
.bar{height:5px;border-radius:9px;background:rgba(0,0,0,.25);margin:10px 0 4px}.bar i{display:block;height:100%;border-radius:9px;background:rgba(255,255,255,.9)}
.lst{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--border);background:none;text-align:left;padding:12px 14px}
.li:first-child{border-top:0}
.li .e{width:40px;height:40px;flex:none;border-radius:10px;background:var(--tint);display:grid;place-items:center;font-size:20px}
.li .m{flex:1;min-width:0}.li b{font-size:14px}.li small{display:block;color:var(--text3);font-size:12px}
.li .bar{background:var(--border);margin:6px 0 0}.li .bar i{background:var(--primary)}
.due{background:#FEE2E2;color:#B91C1C;border-radius:6px;font-size:11px;padding:1px 6px;font-weight:600;margin-left:6px}
.pc{font:700 12px 'JetBrains Mono',monospace;color:var(--green)}
.bk{display:flex;align-items:center;gap:10px;margin-bottom:12px}.bk h2{margin:0;font-size:16px}.bk small{color:var(--text3);font-size:12px}
.bb{border:1px solid var(--border);background:var(--tint);border-radius:10px;padding:8px 12px;font-weight:600}
.gq{margin-left:auto;background:var(--green);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:700}
.mod{display:inline-block;background:var(--primary-dark);color:#fff;border-radius:99px;padding:5px 14px;font-size:12px;font-weight:700;margin:6px 0 10px}
.tp{background:var(--tint);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;padding:12px}
.th{display:flex;align-items:center;gap:10px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.th .cd{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font:700 12px 'JetBrains Mono',monospace;color:var(--ink)}
.th b{flex:1;font-size:14px}
.df{font-style:normal;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;background:#DCFCE7;color:#15803D}
.df.m{background:#FEF3C7;color:#92400E}.df.h{background:#FEE2E2;color:#B91C1C}
.ask{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;margin:12px 0}

.box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:8px 0}
.box h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;color:var(--text2);text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:color-mix(in srgb,var(--primary) 12%,var(--surface));color:var(--ink);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600}
.box p{margin:0 0 8px}
.qh{display:flex;align-items:center;gap:10px}.tm{margin-left:auto;font:700 13px 'JetBrains Mono',monospace;background:var(--tint);border-radius:8px;padding:6px 10px}
.pb{height:5px;background:var(--border);border-radius:9px;margin:12px 0}.pb i{display:block;height:100%;background:var(--primary);border-radius:9px}
.qc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;font-size:16px}
.qc small{display:block;color:var(--text3);font-size:12px;margin-bottom:6px}
.op{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:14px;margin-bottom:8px;text-align:left;font-size:15px}
.op i{font-style:normal;font-weight:700;width:26px;height:26px;border-radius:8px;background:var(--tint);display:grid;place-items:center;font-size:13px}
.op.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--surface))}
.op.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--surface))}
.nx{width:100%;border:0;border-radius:12px;background:var(--primary-dark);color:#fff;padding:14px;font-weight:700;font-size:15px;margin-top:6px}
.nx:disabled{opacity:.4;cursor:default}
.tg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc{position:relative;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:14px;text-align:left}
.tc.w{grid-column:1/-1}.tc .e{font-size:26px}.tc b{display:block;margin-top:8px}.tc small{color:var(--text3);font-size:12px}
.tc em{position:absolute;top:10px;right:10px;font-style:normal;font-size:10px;font-weight:700;background:color-mix(in srgb,var(--primary) 14%,var(--surface));color:var(--ink);border-radius:5px;padding:1px 7px}
.tabs{display:flex;border-bottom:1px solid var(--border);margin:-14px -14px 14px;background:var(--surface)}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;font-size:12px;color:var(--text3)}.tabs .on{color:var(--ink);font-weight:700;border-bottom:2px solid var(--primary)}
.emp{text-align:center;padding:50px 16px;color:var(--text3)}.emp b{display:block;color:var(--text2);font-size:15px}.emp .e{font-size:30px}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 6px;text-align:center}
.stc b{display:block;font:700 24px 'JetBrains Mono',monospace;color:var(--ink)}.stc small{color:var(--text3);font-size:12px}
.pf{text-align:center;padding:10px 0 14px}.av{width:72px;height:72px;border-radius:50%;background:var(--surface);border:2px solid var(--primary);display:grid;place-items:center;font-weight:800;font-size:22px;margin:0 auto 8px}
.li .v{color:var(--text3);font-size:12px}
.sw{width:42px;height:24px;border-radius:99px;background:var(--border);position:relative;flex:none;border:0}.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.sw[aria-checked=true]{background:var(--green)}.sw[aria-checked=true]::after{left:21px}
.note{font-size:12px;color:var(--text3);margin:8px 2px}
.fab{position:fixed;right:max(14px,calc(50% - 346px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:7}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0F172A;color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;z-index:9;max-width:88%}
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;background:var(--primary-dark);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:720px}

nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.fc{width:100%;min-height:180px;border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:20px;margin:14px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.fct{font-size:19px;line-height:1.4}
.fch{color:var(--text3);font-size:12px}
.fcs{font-size:15px;line-height:1.5;color:var(--text2)}
@media (max-width:420px){.ib.s{display:none}.logo{font-size:15px}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}.scrim>.bdp{position:absolute;inset:0;background:none;border:0}
.sheet{position:relative;background:var(--surface);color:var(--text);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:16px}.sheet input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;margin-bottom:10px}
.sheet .li{border-radius:10px;border:1px solid var(--border);margin-bottom:8px}.sheet .li.on{border-color:var(--primary);background:var(--tint)}.sheet .dg{background:var(--red)}
.ps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 2px}.ps div{text-align:center}.ps b{display:block;font:700 18px 'JetBrains Mono',monospace;color:var(--ink)}.ps small{color:var(--text3);font-size:11px}
a.li{text-decoration:none;color:inherit}
.bub{padding:10px 12px;border-radius:12px;margin:6px 0;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.bub.me{background:var(--primary);color:#fff;margin-left:28px}.bub.ace{background:var(--tint);margin-right:20px}
.qpc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.qpc button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:99px;padding:7px 12px;font-size:12px;font-weight:600}
.aibar{display:flex;gap:8px;margin-top:8px}.aibar input{margin:0;flex:1}.aibar button{width:auto;margin:0;padding:0 16px}
#ai-msgs{max-height:42vh;overflow:auto;min-height:60px}
.box.ok{background:color-mix(in srgb,var(--green) 10%,var(--surface))}.box.bad{background:color-mix(in srgb,var(--red) 8%,var(--surface))}.box.wn{background:color-mix(in srgb,var(--gold) 10%,var(--surface))}
.fml{border-left:3px solid var(--primary);background:var(--tint);border-radius:8px;padding:8px 10px;margin:6px 0;font:600 13px 'JetBrains Mono',monospace;word-break:break-word}
.stp{display:flex;gap:10px;align-items:flex-start;margin:7px 0;font-size:14px}.stp i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font:700 12px Inter,sans-serif;display:grid;place-items:center;font-style:normal}
.tpa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.tpa button{border:1px solid var(--border);background:var(--tint);color:var(--text);border-radius:10px;padding:10px;font-weight:700;font-size:13px}.tpa .dn{background:color-mix(in srgb,var(--green) 18%,var(--surface))}
.op.sel{border-color:var(--primary);background:var(--tint)}
.tact{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fcard{display:block;width:100%;text-align:left;min-height:180px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:16px;padding:16px;margin:12px 0;font:inherit;line-height:1.5}
.fcard small{display:block;color:var(--text3);font-weight:700;letter-spacing:.06em;margin-bottom:8px}.fcard b{display:block;font-size:16px;margin-bottom:10px}.fcard div{padding:4px 0}
.card a,.note a{color:var(--text);font-weight:700;text-decoration:underline;text-underline-offset:2px}
</style>
</head>

<script>
/* Ace cloud sync: optional. Runs only when ACE_CONFIG.supabaseUrl is set and a student is signed in; otherwise the app stays a local guest app. */
(function(){
 var cfg=window.ACE_CONFIG||{};if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)return;
 var sb=null,uid=null,ready=null;
 function load(){return new Promise(function(ok,no){if(window.supabase)return ok();var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
 function init(){if(ready)return ready;ready=load().then(function(){
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  return sb.auth.getSession()}).then(function(r){var ses=r.data&&r.data.session;if(!ses)return false;uid=ses.user.id;
  ACE_CFG.getToken=function(){return sb.auth.getSession().then(function(x){return x.data.session&&x.data.session.access_token})};
  if(!ACE_CFG.aiUrl)ACE_CFG.aiUrl=cfg.supabaseUrl.replace(/\/$/,'')+'/functions/v1/ai-tutor';
  return pull()}).catch(function(){return false});return ready}
 function pull(){return Promise.all([sb.from('user_stats').select('xp,streak,last_day').eq('user_id',uid).maybeSingle(),sb.from('progress').select('subject,topic,status').eq('user_id',uid),sb.from('profiles').select('level').eq('id',uid).maybeSingle()]).then(function(r){var pl=r[2]&&r[2].data;if(pl&&pl.level&&pl.level!=='other'){P.lvl=pl.level}
  var st=r[0].data,pr=r[1].data||[];
  if(st&&st.xp>(S.xp||0)){S.xp=st.xp;S.streak=Math.max(S.streak||0,st.streak||0);if(st.last_day)S.lastDay=st.last_day;try{localStorage.setItem('ace-xp',S.xp);localStorage.setItem('ace-streak',S.streak)}catch(e){}}
  pr.forEach(function(x){if(x.status!=='not_started')P.done[x.subject+'|'+x.topic]=1});svP();try{render()}catch(e){}return true})}
 function ex(){var c=C[S.c];return c.x[S.x%c.x.length]}
 function run(fn){init().then(function(ok){if(ok&&uid)fn()}).catch(function(){})}
 window.AceSync={
  attempt:function(Q){if(Q.synced)return;Q.synced=1;var sp=Q.sp||{};run(function(){sb.from('quiz_attempts').insert({user_id:uid,exam:exk(ex()),subject:Q.s,topic:sp.tp||null,kind:Q.mode=='mock'?'mock':'quiz',total:Q.mc,correct:Q.sc,seconds:Q.mode=='mock'?Math.round((Math.min(Q.t1,Q.deadline)-Q.t0)/1000):null}).then(function(){},function(){})})},
  topic:function(sub,topic,done){run(function(){sb.from('progress').upsert({user_id:uid,exam:exk(ex()),subject:sub,topic:topic,status:done?'mastered':'not_started',updated_at:new Date().toISOString()}).then(function(){},function(){})})},
  stats:function(g){run(function(){sb.from('user_stats').upsert({user_id:uid,xp:S.xp,streak:S.streak,last_day:S.lastDay,updated_at:new Date().toISOString()}).then(function(){},function(){});
   sb.from('quiz_attempts').insert({user_id:uid,exam:exk(ex()),subject:'daily',kind:'daily',total:Math.max(1,(DAILY[C[S.c].l||'en']||[]).length),correct:Math.min(g.sc,(DAILY[C[S.c].l||'en']||[]).length||g.sc)}).then(function(){},function(){})})},
  start:init,

  fn:function(n,body){return init().then(function(ok){if(!ok)throw {msg:'Sign in first.'};return ACE_CFG.getToken()}).then(function(tok){return fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/functions/v1/'+n,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify(body)})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw {msg:j.error||'Something went wrong.'};return j},function(){throw {msg:'Something went wrong.'}})})}
 };
 window.addEventListener('load',function(){setTimeout(init,300)});
})();
