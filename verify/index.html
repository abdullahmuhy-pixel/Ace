<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f5;--card:#fff;--text:#14211b;--muted:#5a6b62;--primary:#0b6b3a;--border:#d8e3dc;--bad:#a12b2b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1713;--card:#16221b;--text:#e8f2ec;--muted:#9bb0a5;--primary:#5fd18f;--border:#27382e;--bad:#ff8c8c}}
:root[data-theme=dark]{--bg:#0f1713;--card:#16221b;--text:#e8f2ec;--muted:#9bb0a5;--primary:#5fd18f;--border:#27382e;--bad:#ff8c8c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px 16px}
.wrap{max-width:640px;margin:0 auto}h1{font-size:20px;margin:0 0 4px}p{color:var(--muted)}
form{display:flex;gap:8px;margin:16px 0}input{flex:1;min-width:0;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font:inherit;letter-spacing:.1em;text-transform:uppercase}
button{border:0;border-radius:10px;background:var(--primary);color:#fff;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
.cert{background:var(--card);border:2px solid var(--primary);border-radius:16px;padding:32px 20px;text-align:center}
.cert .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.cert h2{font-size:26px;margin:6px 0}.cert .name{font-size:28px;font-weight:800;margin:14px 0}
.ok{color:var(--primary);font-weight:700}.no{color:var(--bad);font-weight:700}.small{font-size:13px;color:var(--muted);margin-top:18px}
@media print{body{background:#fff;color:#000}form,.noprint{display:none}.cert{border-color:#000}}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;color:var(--text);text-decoration:none;margin:0 0 26px}.brand i{width:24px;height:24px;border-radius:50%;background:var(--text);display:grid;place-items:center}.brand i:after{content:'';width:9px;height:9px;border-radius:50%;background:#c8962e}.brand small{font-weight:600;color:var(--muted)}
.lead{color:var(--muted);margin:0 0 16px;max-width:60ch}.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}.foot a{color:var(--muted)}

/* Ace identity (2026-10): shared tokens with the student app and website */
:root{--bg:#F3F4FF;--grid:#E2E5FF;--card:#FFFFFF;--ink:#17123A;--text:#17123A;--mut:#4A4570;--muted:#4A4570;--line:#D9DCF5;--border:#D9DCF5;--pri:#3D35F5;--pri2:#5B54FF;--primary:#3D35F5;--priInk:#FFFFFF;--primary-ink:#FFFFFF;--soft:#ECEEFF;--tint:#ECEEFF;--ok:#0A8A5E;--bad:#D93A3F;--warn:#8A5A00;--gold:#B7791F;--bar:#C9C6FF;--ledge:#CDD1F2;--btn-ledge:#211AA6;--sh:0 3px 0 var(--ledge)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#110E2B;--grid:#1B1740;--card:#1C1842;--ink:#F1EFFF;--text:#F1EFFF;--mut:#BDB8E8;--muted:#BDB8E8;--line:#342E6E;--border:#342E6E;--pri:#7C75FF;--pri2:#9C96FF;--primary:#7C75FF;--priInk:#FFFFFF;--primary-ink:#FFFFFF;--soft:#262158;--tint:#262158;--ok:#3DD9A0;--bad:#FF8085;--warn:#FFC72C;--bar:#3D3590;--ledge:#0B0922;--btn-ledge:#2E27A8;--sh:0 3px 0 var(--ledge);color-scheme:dark}}
:root[data-theme=dark]{--bg:#110E2B;--grid:#1B1740;--card:#1C1842;--ink:#F1EFFF;--text:#F1EFFF;--mut:#BDB8E8;--muted:#BDB8E8;--line:#342E6E;--border:#342E6E;--pri:#7C75FF;--pri2:#9C96FF;--primary:#7C75FF;--priInk:#FFFFFF;--primary-ink:#FFFFFF;--soft:#262158;--tint:#262158;--ok:#3DD9A0;--bad:#FF8085;--warn:#FFC72C;--bar:#3D3590;--ledge:#0B0922;--btn-ledge:#2E27A8;--sh:0 3px 0 var(--ledge);color-scheme:dark}
body{font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
h1,h2,h3,.logo,.brand,header b,.bar b{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;letter-spacing:-.015em}
.btn,button.b,form button,.creator .btn{border-radius:14px!important;font-weight:700;box-shadow:0 4px 0 var(--btn-ledge);transition:transform .12s,box-shadow .12s}
.btn.o,.btn.s,button.g{box-shadow:0 3px 0 var(--ledge);border-width:2px}
.btn:active,button.b:active,form button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-ledge)}
.card,.pane,.cert,.lesson,.item,.creator,.certbox{border-width:2px!important;border-radius:20px!important;box-shadow:0 3px 0 var(--ledge)}
header,header.top{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom-width:2px}
input,select,textarea{border-width:2px!important;border-radius:12px!important}
.chip,.pill,.tag{border-radius:99px}
.chip.on,.tabs button.on,nav button.on,.tpl.on{background:var(--pri,var(--primary))!important;color:#fff!important;border-color:transparent!important}
.logo i,.brand i{background:#FFC72C!important;border-radius:4px 4px 50% 50%!important;box-shadow:inset 0 5px 0 #FF8FB1}
.logo i:after,.brand i:after{display:none!important}
.opt{border-width:2px!important;border-radius:16px!important;box-shadow:0 3px 0 var(--ledge)}
.opt.sel{border-color:var(--pri)!important}
@media print{body{background:#fff!important;background-image:none!important}.card,.cert,.certbox{box-shadow:none}}
</style></head><body><div class="wrap">
<a class="brand" href="../"><i></i>Ace <small>Education</small></a><h1>Certificate check</h1><p>Enter the code printed on a certificate to confirm it is genuine.</p>
<form id="f"><input id="c" maxlength="20" placeholder="CERTIFICATE CODE" autocomplete="off" aria-label="Certificate code"><button>Check</button></form>
<div id="out" aria-live="polite"></div><p class="foot"><a href="../">Ace Education</a> · <a href="../privacy">Privacy</a> · <a href="../contact">Contact</a></p></div>
<script src="../config.js"></script>
<script>
(function(){
  var cfg=window.ACE_CONFIG||{},out=document.getElementById('out'),inp=document.getElementById('c');
  function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
  function show(h){out.innerHTML=h}
  function check(code){
    code=(code||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase(); if(code.length<8)return show('<p class="no">Enter the full code.</p>');
    if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)return show('<p class="no">This page is not connected yet.</p>');
    show('<p>Checking…</p>');
    fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/verify_certificate',{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+cfg.supabaseAnonKey},body:JSON.stringify({p_code:code})})
    .then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){
      if(!rows||!rows.length)return show('<p class="no">No certificate matches that code. Check for typing mistakes.</p>');
      var c=rows[0],d=String(c.issued_at).slice(0,10);
      show('<div class="cert"><div class="k">Ace Education</div><h2>Certificate of completion</h2><div class="k">This certifies that</div><div class="name">'+esc(c.holder_name)+'</div><div class="k">completed and passed</div><h2>'+esc(c.course_title)+'</h2><div>Score '+esc(c.score)+'% • Issued '+esc(d)+'</div><p class="ok">✔ Verified</p><div class="small">Code '+esc(code)+'. This certificate shows course completion on Ace Education. It is not an accredited qualification.</div></div><p class="noprint"><button onclick="window.print()">Print or save as PDF</button></p>');
    }).catch(function(){show('<p class="no">Could not check right now. Try again.</p>')});
  }
  document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();check(inp.value)});
  var q=new URLSearchParams(location.search).get('code'); if(q){inp.value=q;check(q)}
})();
</script></body></html>
