<!doctype html>
<html lang="en"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ace Staff</title>
<script>try{var th=JSON.parse(localStorage.getItem("ace-prefs")||"{}").theme;if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
<style>
:root{--bg:#f4f7f5;--card:#fff;--text:#14211b;--muted:#5a6b62;--primary:#0b6b3a;--primary-ink:#fff;--border:#d8e3dc;--bad:#a12b2b;--ok:#1a7f45;--tint:#eaf3ee}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1713;--card:#16221b;--text:#e8f2ec;--muted:#9bb0a5;--primary:#4cc380;--primary-ink:#06210f;--border:#27382e;--bad:#ff8c8c;--ok:#5fd18f;--tint:#1c2c23}}
:root[data-theme=dark]{--bg:#0f1713;--card:#16221b;--text:#e8f2ec;--muted:#9bb0a5;--primary:#4cc380;--primary-ink:#06210f;--border:#27382e;--bad:#ff8c8c;--ok:#5fd18f;--tint:#1c2c23}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
header b{font-size:17px}header .sp{flex:1}header small{color:var(--muted)}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--border)}
nav button{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
main{max-width:1000px;margin:0 auto;padding:16px}
h2{font-size:19px;margin:0 0 10px}h3{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>*{min-width:0}
label{display:block;font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;margin-top:3px}
textarea{min-height:90px}
button.b{border:0;border-radius:8px;background:var(--primary);color:var(--primary-ink);padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
button.g{border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
button.g.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}button.bad{color:var(--bad)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);vertical-align:top}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td input{margin:0;min-width:70px}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;background:var(--tint)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:90vw;z-index:9}
#toast.bad{background:var(--bad);color:#fff}.hide{display:none}
@media print{header,nav,.noprint{display:none}}
</style></head><body>
<header><b>Ace Staff</b><span class="sp"></span><small id="who"></small><button class="g" id="out" hidden>Sign out</button></header>
<nav id="nav" aria-label="Sections"></nav><main id="main"><p class="muted">Loading…</p></main><div id="toast" class="hide" role="status"></div>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
'use strict';
const CFG = window.ACE_CONFIG || {}, $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const today = () => new Date().toISOString().slice(0, 10);
let sb, me, St = { tab: '', cls: '', classes: [], asmt: '', task: '', live: '', peer: '', day: today() };
const STAFF = ['teacher', 'subject_teacher', 'school_admin', 'platform_admin'];

function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = bad ? 'bad' : ''; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'hide', 4500); }
const must = r => { if (r.error) throw new Error(r.error.message); return r.data; };
async function fn(name, body) {
  const { data } = await sb.auth.getSession(); const tok = data.session && data.session.access_token;
  const r = await fetch(CFG.supabaseUrl.replace(/\/$/, '') + '/functions/v1/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Something went wrong.'); return j;
}
const guard = f => async (...a) => { try { return await f(...a); } catch (e) { toast(e.message || String(e), true); } };

/* ---------- boot ---------- */
async function boot() {
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) { $('#main').innerHTML = '<div class="card">This page is not connected to Supabase yet. Fill in <code>config.js</code>.</div>'; return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{storage:{getItem:function(k){try{var a=localStorage.getItem(k);return a!=null?a:sessionStorage.getItem(k)}catch(e){return null}},setItem:function(k,v){try{if(sessionStorage.getItem(k)!=null&&localStorage.getItem(k)==null)sessionStorage.setItem(k,v);else localStorage.setItem(k,v)}catch(e){}},removeItem:function(k){try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch(e){}}},persistSession:true,autoRefreshToken:true}});
  const { data } = await sb.auth.getSession();
  if (!data.session) { $('#main').innerHTML = '<div class="card"><b>Please sign in</b><p class="muted">Staff sign in on the main sign-in page, then return here.</p><a class="b" style="display:inline-block;padding:9px 14px;border-radius:8px;text-decoration:none;background:var(--primary);color:var(--primary-ink)" href="../login/">Go to sign in</a></div>'; $('#nav').innerHTML = ''; return; }
  me = must(await sb.from('profiles').select('*').eq('id', data.session.user.id).single());
  if (!STAFF.includes(me.role)) { $('#main').innerHTML = '<div class="card"><b>This area is for teachers and school staff.</b><p class="muted">Students use the student app.</p><a href="../app/">Open the student app</a></div>'; $('#nav').innerHTML = ''; return; }
  $('#who').textContent = me.first_name + ' ' + me.surname + ' • ' + me.role.replace('_', ' ');
  $('#out').hidden = false; $('#out').onclick = async () => { await sb.auth.signOut(); location.href = '../login/'; };
  if (me.role !== 'platform_admin') {
    if (me.role === 'school_admin') St.classes = must(await sb.from('classes').select('id,name,grade,school_id').eq('school_id', me.school_id).order('name'));
    else { const ts = must(await sb.from('teacher_subjects').select('class_id,subject,classes(id,name,grade,school_id)').eq('teacher_id', me.id)); const seen = {}; ts.forEach(t => { if (t.classes && !seen[t.class_id]) seen[t.class_id] = t.classes; }); St.classes = Object.values(seen).sort((a, b) => a.name.localeCompare(b.name)); }
    St.cls = (St.classes[0] || {}).id || '';
  }
  St.tab = me.role === 'platform_admin' ? 'schools' : 'overview';
  go();
}
const TABS = {
  class: [['overview', 'Overview'], ['attendance', 'Attendance'], ['marks', 'Marks'], ['tasks', 'Tasks'], ['notices', 'Notices'], ['messages', 'Messages'], ['live', 'Live quiz'], ['parents', 'Parents'], ['mod', 'Moderation']],
  admin: [['school', 'School']],
  platform: [['schools', 'Schools'], ['plans', 'Plans and codes'], ['settings', 'Settings'], ['reports', 'Reports and errors'], ['mod', 'Moderation']]
};
function go() { guard(async () => {
  const tabs = me.role === 'platform_admin' ? TABS.platform : TABS.class.concat(me.role === 'school_admin' ? TABS.admin : []);
  $('#nav').innerHTML = tabs.map(t => `<button data-tab="${t[0]}" class="${St.tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('');
  const needsClass = me.role !== 'platform_admin' && !['mod', 'school'].includes(St.tab);
  let h = '';
  if (needsClass) h += St.classes.length ? `<div class="row"><label>Class<select data-cls>${St.classes.map(c => `<option value="${c.id}" ${c.id === St.cls ? 'selected' : ''}>${esc(c.name)} (${esc(c.grade)})</option>`).join('')}</select></label></div>` : '<div class="card">You are not assigned to a class yet. Ask your school admin.</div>';
  if (!needsClass || St.cls) h += await V[St.tab]();
  $('#main').innerHTML = h;
})(); }

/* ---------- helpers ---------- */
const students = async () => must(await sb.from('class_overview').select('*').eq('class_id', St.cls).order('surname'));
const nm = s => esc(s.first_name + ' ' + s.surname);
const table = (head, rows) => `<div class="tw"><table><thead><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('') || `<tr><td colspan="${head.length}" class="muted">Nothing here yet.</td></tr>`}</tbody></table></div>`;
const csv = (rows) => rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n');
function saveCsv(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name; a.click(); }

/* ---------- views ---------- */
const V = {
  async overview() {
    const s = await students(); St._ov = s;
    return `<div class="card"><div class="row"><h2 style="flex:1;margin:0">Class overview</h2><button class="g" data-a="csv-ov">Export CSV</button></div>
${table(['Student', 'XP', 'Streak', 'Last active', 'Quizzes (30d)', 'Average', 'Topics mastered'], s.map(x => `<tr><td>${nm(x)}</td><td>${x.xp}</td><td>${x.streak}</td><td>${esc(x.last_day || '-')}</td><td>${x.attempts}</td><td>${x.avg_pct == null ? '-' : x.avg_pct + '%'}</td><td>${x.topics_mastered}</td></tr>`))}</div>`;
  },
  async attendance() {
    const s = await students(), a = must(await sb.from('attendance').select('student_id,status').eq('class_id', St.cls).eq('day', St.day)), m = {}; a.forEach(x => m[x.student_id] = x.status);
    return `<div class="card"><div class="row"><h2 style="flex:1;margin:0">Attendance</h2><label>Date<input type="date" data-day value="${St.day}" max="${today()}"></label><button class="g" data-a="att-all" data-s="present">Mark all present</button></div>
${table(['Student', 'Status'], s.map(x => `<tr><td>${nm(x)}</td><td>${['present', 'absent', 'late', 'excused'].map(k => `<button class="g ${m[x.student_id] === k ? 'on' : ''}" data-a="att" data-sid="${x.student_id}" data-s="${k}">${k}</button>`).join(' ')}</td></tr>`))}</div>`;
  },
  async marks() {
    const as = must(await sb.from('assessments').select('*').eq('class_id', St.cls).order('held_on', { ascending: false, nullsFirst: false }));
    let h = `<div class="card"><h2>New assessment</h2><form data-f="asmt"><div class="row"><label>Title<input name="title" required maxlength="120"></label><label>Subject<input name="subject" required maxlength="60"></label>
<label>Type<select name="kind">${['test', 'task', 'oral', 'project', 'exam'].map(k => `<option>${k}</option>`).join('')}</select></label><label>Out of<input name="max_mark" type="number" min="1" step="any" value="100" required></label>
<label>Weight %<input name="weight" type="number" min="0" max="100" step="any" value="0"></label><label>Date<input name="held_on" type="date" value="${today()}"></label><button class="b">Add</button></div></form></div>
<div class="card"><h2>Assessments</h2>${table(['Title', 'Subject', 'Out of', 'Weight', 'Date', ''], as.map(x => `<tr><td>${esc(x.title)}</td><td>${esc(x.subject)}</td><td>${x.max_mark}</td><td>${x.weight}%</td><td>${esc(x.held_on || '')}</td><td><button class="g" data-a="open-asmt" data-id="${x.id}">Enter marks</button></td></tr>`))}</div>`;
    if (St.asmt) {
      const a = as.find(x => x.id === St.asmt);
      if (a) { const s = await students(), mk = must(await sb.from('marks').select('student_id,mark,comment').eq('assessment_id', a.id)), mm = {}; mk.forEach(x => mm[x.student_id] = x);
        h += `<div class="card"><h2>${esc(a.title)} <span class="muted">out of ${a.max_mark}</span></h2><form data-f="marks">${table(['Student', 'Mark', 'Comment'], s.map(x => `<tr><td>${nm(x)}</td><td><input name="m_${x.student_id}" type="number" min="0" max="${a.max_mark}" step="any" value="${mm[x.student_id] ? mm[x.student_id].mark : ''}"></td><td><input name="c_${x.student_id}" maxlength="500" value="${esc(mm[x.student_id] ? mm[x.student_id].comment : '')}"></td></tr>`))}<p><button class="b">Save marks</button></p></form></div>`; }
    }
    const sba = must(await sb.from('sba_summary').select('*').eq('class_id', St.cls)); if (sba.length) { const s = await students(), nmap = {}; s.forEach(x => nmap[x.student_id] = x);
      h += `<div class="card"><h2>Continuous assessment so far</h2>${table(['Student', 'Subject', 'Weighted %', 'Items'], sba.map(x => `<tr><td>${nmap[x.student_id] ? nm(nmap[x.student_id]) : ''}</td><td>${esc(x.subject)}</td><td>${x.weighted_pct}%</td><td>${x.items}</td></tr>`))}</div>`; }
    return h;
  },
  async tasks() {
    const ts = must(await sb.from('tasks').select('*').eq('class_id', St.cls).order('created_at', { ascending: false }));
    let h = `<div class="card"><h2>New task</h2><form data-f="task"><div class="row"><label>Title<input name="title" required maxlength="160"></label><label>Subject<input name="subject" maxlength="60"></label><label>Due<input name="due_on" type="date"></label></div><label>Instructions<textarea name="body" maxlength="4000"></textarea></label><p><button class="b">Set task</button></p></form></div>
<div class="card"><h2>Tasks</h2>${table(['Title', 'Subject', 'Due', ''], ts.map(x => `<tr><td>${esc(x.title)}</td><td>${esc(x.subject || '')}</td><td>${esc(x.due_on || '')}</td><td><button class="g" data-a="open-task" data-id="${x.id}">Submissions</button></td></tr>`))}</div>`;
    if (St.task) { const sub = must(await sb.from('task_submissions').select('*,profiles!task_submissions_student_id_fkey(first_name,surname)').eq('task_id', St.task));
      h += `<div class="card"><h2>Submissions</h2>${sub.length ? sub.map(x => `<form data-f="mark-sub" data-sid="${x.student_id}" class="card"><b>${esc(x.profiles.first_name + ' ' + x.profiles.surname)}</b> <span class="muted">${esc(String(x.submitted_at).slice(0, 16).replace('T', ' '))}</span><p style="white-space:pre-wrap">${esc(x.body || '')}</p><div class="row"><label>Mark<input name="mark" type="number" min="0" step="any" value="${x.mark == null ? '' : x.mark}"></label><label style="flex:1">Feedback<input name="feedback" maxlength="2000" value="${esc(x.feedback || '')}"></label><button class="b">Save</button></div></form>`).join('') : '<p class="muted">No submissions yet.</p>'}</div>`; }
    return h;
  },
  async notices() {
    const an = must(await sb.from('announcements').select('*').or(`class_id.eq.${St.cls},class_id.is.null`).order('created_at', { ascending: false }).limit(20));
    return `<div class="card"><h2>New notice</h2><form data-f="notice"><label>Title<input name="title" required maxlength="140"></label><label>Message<textarea name="body" required maxlength="4000"></textarea></label>
<div class="row"><label>Send to<select name="scope"><option value="class">This class</option>${me.role === 'school_admin' ? '<option value="school">Whole school</option>' : ''}</select></label><label style="display:flex;gap:6px;align-items:center;margin-bottom:8px"><input type="checkbox" name="push" style="width:auto;margin:0"> Also send a phone notification to this class</label><button class="b">Post</button></div></form></div>
<div class="card"><h2>Recent notices</h2>${table(['When', 'Title', 'To'], an.map(x => `<tr><td>${esc(String(x.created_at).slice(0, 10))}</td><td><b>${esc(x.title)}</b><br><span class="muted">${esc(x.body.slice(0, 160))}</span></td><td>${x.class_id ? 'Class' : 'School'}</td></tr>`))}</div>`;
  },
  async messages() {
    const s = await students(), un = must(await sb.from('messages').select('sender_id').eq('recipient_id', me.id).is('read_at', null)), cnt = {}; un.forEach(x => cnt[x.sender_id] = (cnt[x.sender_id] || 0) + 1);
    let h = `<div class="card"><h2>Messages</h2><label>Student<select data-peer><option value="">Choose a student</option>${s.map(x => `<option value="${x.student_id}" ${St.peer === x.student_id ? 'selected' : ''}>${nm(x)}${cnt[x.student_id] ? ' (' + cnt[x.student_id] + ' new)' : ''}</option>`).join('')}</select></label></div>`;
    if (St.peer) { const t = must(await sb.from('messages').select('*').or(`and(sender_id.eq.${me.id},recipient_id.eq.${St.peer}),and(sender_id.eq.${St.peer},recipient_id.eq.${me.id})`).order('created_at', { ascending: true }).limit(100));
      await sb.from('messages').update({ read_at: new Date().toISOString() }).eq('recipient_id', me.id).eq('sender_id', St.peer).is('read_at', null);
      h += `<div class="card">${t.map(x => `<p style="margin:6px 0;${x.sender_id === me.id ? 'text-align:right' : ''}"><span class="pill">${esc(x.body)}</span><br><small class="muted">${esc(String(x.created_at).slice(5, 16).replace('T', ' '))}</small></p>`).join('') || '<p class="muted">No messages yet.</p>'}
<form data-f="msg" class="row"><label style="flex:1">Message<input name="body" required maxlength="2000" autocomplete="off"></label><button class="b">Send</button></form></div>`; }
    return h;
  },
  async live() {
    const ss = must(await sb.from('live_sessions').select('id,code,state,current_index,questions,created_at').eq('class_id', St.cls).order('created_at', { ascending: false }).limit(10));
    let h = `<div class="card"><h2>New live quiz</h2><form data-f="live"><label>Questions: one per line, in the form <code>Question | A | B | C | D | correct letter</code><textarea name="qs" required placeholder="What is 7 x 8? | 54 | 56 | 58 | 64 | B"></textarea></label><p><button class="b">Create quiz</button></p></form></div>
<div class="card"><h2>My quizzes</h2>${table(['Code', 'Questions', 'State', ''], ss.map(x => `<tr><td><b style="font-size:18px;letter-spacing:.1em">${esc(x.code)}</b></td><td>${(x.questions || []).length}</td><td><span class="pill">${esc(x.state)}</span> ${x.state === 'running' ? 'Q' + (x.current_index + 1) : ''}</td><td>
${x.state === 'lobby' ? `<button class="g" data-a="live-st" data-id="${x.id}" data-s="running">Start</button>` : ''}${x.state === 'running' ? `<button class="g" data-a="live-next" data-id="${x.id}">Next question</button> <button class="g bad" data-a="live-st" data-id="${x.id}" data-s="ended">End</button>` : ''} <button class="g" data-a="open-live" data-id="${x.id}">Scores</button></td></tr>`))}<p class="muted">Students enter the code in the student app (Today, Live quiz).</p></div>`;
    if (St.live) { const ans = must(await sb.from('live_answers').select('student_id,correct').eq('session_id', St.live)), s = await students(), sc = {}; ans.forEach(a => { sc[a.student_id] = sc[a.student_id] || { c: 0, n: 0 }; sc[a.student_id].n++; if (a.correct) sc[a.student_id].c++; });
      h += `<div class="card"><h2>Scores</h2>${table(['Student', 'Correct', 'Answered'], s.filter(x => sc[x.student_id]).sort((a, b) => sc[b.student_id].c - sc[a.student_id].c).map(x => `<tr><td>${nm(x)}</td><td>${sc[x.student_id].c}</td><td>${sc[x.student_id].n}</td></tr>`))}<button class="g" data-a="refresh">Refresh</button></div>`; }
    return h;
  },
  async parents() {
    const s = await students(), ids = s.map(x => x.student_id), g = ids.length ? must(await sb.from('guardians').select('*').in('student_id', ids)) : [], byS = {}; s.forEach(x => byS[x.student_id] = x);
    return `<div class="card"><h2>Parent and guardian digest</h2><p class="muted">Emails go only to guardians who agreed to receive them. Record their consent here only after they have told you or signed.</p>
<form data-f="guardian"><div class="row"><label>Student<select name="student_id" required>${s.map(x => `<option value="${x.student_id}">${nm(x)}</option>`).join('')}</select></label><label>Guardian name<input name="name" maxlength="80"></label><label>E-mail<input name="email" type="email" required></label>
<label style="display:flex;gap:6px;align-items:center;margin-bottom:8px"><input type="checkbox" name="consent" style="width:auto;margin:0"> Guardian agreed to the weekly digest</label><button class="b">Add</button></div></form></div>
<div class="card">${table(['Student', 'Guardian', 'E-mail', 'Digest'], g.map(x => `<tr><td>${byS[x.student_id] ? nm(byS[x.student_id]) : ''}</td><td>${esc(x.name || '')}</td><td>${esc(x.email)}</td><td>${x.digest_opt_in && x.consent_at ? '<span class="pill">on</span>' : '<span class="muted">off</span>'}</td></tr>`))}
<p><button class="b" data-a="digest">Send this week’s digest to this class</button></p></div>`;
  },
  async mod() {
    const q = must(await sb.rpc('mod_queue'));
    return `<div class="card"><h2>Study-group moderation</h2><p class="muted">Posts that were reported or hidden. Three different reports hide a post automatically.</p>${table(['Group', 'Author', 'Post', 'Reports', ''], q.map(x => `<tr><td>${esc(x.group_name)}</td><td>${esc(x.author)}</td><td>${esc(x.body)}<br><span class="pill">${x.hidden ? 'hidden' : 'visible'}</span></td><td>${x.reports}</td><td>${x.hidden ? `<button class="g" data-a="mod" data-id="${x.post_id}" data-s="restore">Restore</button>` : `<button class="g" data-a="mod" data-id="${x.post_id}" data-s="hide">Hide</button>`} <button class="g bad" data-a="mod" data-id="${x.post_id}" data-s="remove">Remove</button></td></tr>`))}</div>`;
  },
  async school() {
    const sc = must(await sb.from('schools').select('*').eq('id', me.school_id).single()), s = must(await sb.from('profiles').select('id,first_name,surname,class_id,username,student_number,role,last_seen_at').eq('school_id', me.school_id).order('surname').limit(500)), cl = {}; St.classes.forEach(c => cl[c.id] = c);
    const clsOpts = St.classes.map(c => `<option value="${c.id}">${esc(c.name)} (${esc(c.grade)})</option>`).join('');
    return `<div class="card"><h2>${esc(sc.name)} <span class="muted">code ${esc(sc.school_code)}</span></h2><p class="muted">Students join with the school code or are created by you below.</p></div>
<div class="card"><h2>AI help settings</h2><form data-f="ai"><div class="row"><label>Mode<select name="ai_mode">${['limited', 'full', 'off'].map(k => `<option ${sc.ai_mode === k ? 'selected' : ''}>${k}</option>`).join('')}</select></label><label>Questions per period<input name="ai_cap" type="number" min="0" max="500" value="${sc.ai_cap == null ? '' : sc.ai_cap}" placeholder="platform default"></label>
<label>Period<select name="ai_period">${['daily', 'weekly'].map(k => `<option ${sc.ai_period === k ? 'selected' : ''}>${k}</option>`).join('')}</select></label><button class="b">Save</button></div></form></div>
<div class="card"><h2>Add students</h2><form data-f="bulk"><label>Class<select name="class_id">${clsOpts}</select></label><label>One student per line: First name Surname<textarea name="list" required placeholder="Ada Okafor\nTunde Bello"></textarea></label><p><button class="b">Create accounts</button></p></form><div id="creds"></div></div>
<div class="card"><h2>Invite a teacher</h2><form data-f="invite"><div class="row"><label>First name<input name="first_name" required></label><label>Surname<input name="surname" required></label><label>E-mail<input name="email" type="email" required></label><label>Role<select name="role"><option value="teacher">Teacher</option><option value="subject_teacher">Subject teacher</option></select></label>
<label>Class<select name="class_id"><option value="">(assign later)</option>${clsOpts}</select></label><label>Subject<input name="subject" maxlength="60"></label><button class="b">Invite</button></div></form></div>
<div class="card"><h2>Classes</h2><form data-f="class" class="row"><label>Name<input name="name" required maxlength="40"></label><label>Grade<input name="grade" required maxlength="20" placeholder="SS3"></label><button class="b">Add class</button></form>
${table(['Class', 'Grade', 'Students'], St.classes.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.grade)}</td><td>${s.filter(x => x.class_id === c.id && x.role === 'student').length}</td></tr>`))}</div>
<div class="card"><h2>People (${s.length})</h2>${table(['Name', 'Role', 'Class', 'Username', 'Student no.'], s.map(x => `<tr><td>${esc(x.first_name + ' ' + x.surname)}</td><td>${esc(x.role.replace('_', ' '))}</td><td>${esc(cl[x.class_id] ? cl[x.class_id].name : '')}</td><td>${esc(x.username || '')}</td><td>${esc(x.student_number || '')}</td></tr>`))}</div>`;
  },
  async schools() {
    const s = must(await sb.from('schools').select('*').order('created_at', { ascending: false }).limit(200)), cc = must(await sb.from('countries').select('code,name').order('name'));
    return `<div class="card"><h2>New school</h2><form data-f="school"><div class="row"><label>School name<input name="name" required maxlength="120"></label><label>Country<select name="country_code">${cc.map(c => `<option value="${c.code}">${esc(c.name)}</option>`).join('')}</select></label><label>Region<input name="region" maxlength="80"></label></div>
<div class="row"><label>Admin first name<input name="admin_first" required></label><label>Admin surname<input name="admin_surname" required></label><label>Admin e-mail<input name="admin_email" type="email" required></label><button class="b">Create school</button></div></form></div>
<div class="card"><h2>Schools (${s.length})</h2>${table(['Name', 'Country', 'Code', 'Active', ''], s.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.country_code)}</td><td>${esc(x.school_code)}</td><td>${x.active ? 'yes' : 'no'}</td><td><button class="g" data-a="school-active" data-id="${x.id}" data-v="${x.active ? '' : '1'}">${x.active ? 'Deactivate' : 'Activate'}</button></td></tr>`))}</div>`;
  },
  async plans() {
    const p = must(await sb.from('plans').select('*').order('country_code', { nullsFirst: true }).order('amount_minor')), pr = must(await sb.from('promo_codes').select('*').order('code')), cc = must(await sb.from('countries').select('code,name').order('name'));
    return `<div class="card"><h2>Add or update a plan</h2><p class="muted">Use an existing code to change a plan. Prices are in normal units (for example 2500 for N2,500).</p><form data-f="plan"><div class="row"><label>Code<input name="code" required pattern="[a-z0-9_-]{2,40}" placeholder="family-month"></label><label>Name<input name="name" required></label>
<label>Country<select name="country_code"><option value="">Any country</option>${cc.map(c => `<option value="${c.code}">${esc(c.name)}</option>`).join('')}</select></label><label>Currency<input name="currency_code" required maxlength="3" placeholder="NGN" style="text-transform:uppercase"></label><label>Price<input name="price" type="number" min="0" step="0.01" required></label>
<label>Billing<select name="period"><option>month</option><option>term</option><option>year</option></select></label><label>People on plan<select name="seats"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></label><label>For<select name="audience"><option>student</option><option>school</option></select></label><button class="b">Save plan</button></div></form></div>
<div class="card"><h2>Plans</h2>${table(['Code', 'Name', 'Country', 'Price', 'People', 'For', 'On sale', ''], p.map(x => `<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.country_code || 'any')}</td><td>${(x.amount_minor / 100).toFixed(2)} ${esc(x.currency_code)} / ${esc(x.period)}</td><td>${x.seats}</td><td>${esc(x.audience)}</td><td>${x.active ? 'yes' : 'no'}</td><td><button class="g" data-a="plan-active" data-id="${esc(x.code)}" data-v="${x.active ? '' : '1'}">${x.active ? 'Take off sale' : 'Put on sale'}</button></td></tr>`))}</div>
<div class="card"><h2>Promo codes</h2><form data-f="promo"><div class="row"><label>Code<input name="code" required pattern="[A-Za-z0-9_-]{3,32}"></label><label>Type<select name="kind"><option value="trial_extension">Extend trial</option><option value="free_days">Free days</option></select></label><label>Days<input name="value" type="number" min="1" max="365" value="7" required></label><label>Max uses<input name="max_uses" type="number" min="1" placeholder="unlimited"></label><label>Expires<input name="expires_at" type="date"></label><button class="b">Add code</button></div></form>
${table(['Code', 'Type', 'Days', 'Used', 'Max', 'Expires', 'Active', ''], pr.map(x => `<tr><td>${esc(x.code)}</td><td>${esc(x.kind)}</td><td>${x.value}</td><td>${x.used_count}</td><td>${x.max_uses || '-'}</td><td>${esc(String(x.expires_at || '').slice(0, 10))}</td><td>${x.active ? 'yes' : 'no'}</td><td><button class="g" data-a="promo-active" data-id="${esc(x.code)}" data-v="${x.active ? '' : '1'}">${x.active ? 'Disable' : 'Enable'}</button></td></tr>`))}</div>`;
  },
  async settings() {
    const c = must(await sb.from('platform_config').select('*').eq('id', 'global').single());
    return `<div class="card"><h2>Platform settings</h2><form data-f="config"><div class="row"><label>Default AI questions per day<input name="ai_default_cap" type="number" min="0" value="${c.ai_default_cap}"></label><label>Free trial days<input name="trial_days" type="number" min="0" max="60" value="${c.trial_days}"></label>
<label style="display:flex;gap:6px;align-items:center;margin-bottom:8px"><input type="checkbox" name="maintenance" style="width:auto;margin:0" ${c.maintenance ? 'checked' : ''}> Maintenance mode</label></div><label>Banner shown to everyone (optional)<input name="banner" maxlength="300" value="${esc(c.banner || '')}"></label><p><button class="b">Save</button></p></form></div>`;
  },
  async reports() {
    const r = must(await sb.from('content_reports').select('*').order('created_at', { ascending: false }).limit(60)), e = must(await sb.from('app_errors').select('*').order('created_at', { ascending: false }).limit(40));
    return `<div class="card"><h2>Content reports</h2>${table(['When', 'Where', 'Report', 'Status'], r.map(x => `<tr><td>${esc(String(x.created_at).slice(0, 10))}</td><td>${esc([x.country_code, x.exam, x.subject, x.topic].filter(Boolean).join(' / '))}<br><span class="pill">${esc(x.item || '')}</span></td><td>${esc(x.note)}</td><td><select data-a="report-st" data-id="${x.id}">${['open', 'fixed', 'rejected'].map(k => `<option ${x.status === k ? 'selected' : ''}>${k}</option>`).join('')}</select></td></tr>`))}</div>
<div class="card"><h2>Recent app errors</h2>${table(['When', 'Page', 'Message'], e.map(x => `<tr><td>${esc(String(x.created_at).slice(0, 16).replace('T', ' '))}</td><td>${esc(x.page || '')}</td><td>${esc(x.message || '')}</td></tr>`))}</div>`;
  }
};

/* ---------- actions ---------- */
const A = {
  'csv-ov': () => saveCsv('class-overview.csv', csv([['Student', 'XP', 'Streak', 'Last active', 'Quizzes 30d', 'Average %', 'Topics mastered']].concat((St._ov || []).map(x => [x.first_name + ' ' + x.surname, x.xp, x.streak, x.last_day, x.attempts, x.avg_pct, x.topics_mastered])))),
  att: async el => { must(await sb.from('attendance').upsert({ class_id: St.cls, student_id: el.dataset.sid, day: St.day, status: el.dataset.s, noted_by: me.id })); go(); },
  'att-all': async () => { const s = await students(); must(await sb.from('attendance').upsert(s.map(x => ({ class_id: St.cls, student_id: x.student_id, day: St.day, status: 'present', noted_by: me.id })))); toast('Marked all present.'); go(); },
  'open-asmt': el => { St.asmt = el.dataset.id; go(); }, 'open-task': el => { St.task = el.dataset.id; go(); }, 'open-live': el => { St.live = el.dataset.id; go(); }, refresh: () => go(),
  'live-st': async el => { must(await sb.from('live_sessions').update({ state: el.dataset.s, current_index: 0 }).eq('id', el.dataset.id)); go(); },
  'live-next': async el => { const s = must(await sb.from('live_sessions').select('current_index,questions').eq('id', el.dataset.id).single()); const n = s.current_index + 1; must(await sb.from('live_sessions').update(n >= s.questions.length ? { state: 'ended' } : { current_index: n }).eq('id', el.dataset.id)); go(); },
  digest: async () => { const r = await fn('send-parent-digest', { class_id: St.cls }); toast(`Digest sent to ${r.sent} guardian(s)${r.skipped ? ', ' + r.skipped + ' skipped' : ''}.`); },
  mod: async el => { must(await sb.rpc('moderate_post', { pid: +el.dataset.id, p_action: el.dataset.s })); go(); },
  'school-active': async el => { must(await sb.from('schools').update({ active: !!el.dataset.v }).eq('id', el.dataset.id)); go(); },
  'plan-active': async el => { must(await sb.from('plans').update({ active: !!el.dataset.v }).eq('code', el.dataset.id)); go(); },
  'promo-active': async el => { must(await sb.from('promo_codes').update({ active: !!el.dataset.v }).eq('code', el.dataset.id)); go(); },
  'report-st': async el => { must(await sb.from('content_reports').update({ status: el.value }).eq('id', el.dataset.id)); toast('Updated.'); }
};
const F = {
  asmt: async d => { must(await sb.from('assessments').insert({ class_id: St.cls, subject: d.subject.trim(), title: d.title.trim(), kind: d.kind, max_mark: +d.max_mark, weight: +d.weight || 0, held_on: d.held_on || null, created_by: me.id })); toast('Assessment added.'); go(); },
  marks: async (d) => { const rows = []; Object.keys(d).forEach(k => { if (k[0] === 'm' && k[1] === '_' && d[k] !== '') rows.push({ assessment_id: St.asmt, student_id: k.slice(2), mark: +d[k], comment: d['c_' + k.slice(2)] || null, updated_at: new Date().toISOString() }); });
    if (!rows.length) return toast('Enter at least one mark.', true); must(await sb.from('marks').upsert(rows)); toast(rows.length + ' marks saved.'); go(); },
  task: async d => { must(await sb.from('tasks').insert({ class_id: St.cls, title: d.title.trim(), subject: d.subject || null, body: d.body || null, due_on: d.due_on || null, created_by: me.id })); toast('Task set.'); go(); },
  'mark-sub': async (d, f) => { must(await sb.from('task_submissions').update({ mark: d.mark === '' ? null : +d.mark, feedback: d.feedback || null, marked_by: me.id }).eq('task_id', St.task).eq('student_id', f.dataset.sid)); toast('Saved.'); },
  notice: async d => { const school = d.scope === 'school'; const cls = St.classes.find(c => c.id === St.cls);
    must(await sb.from('announcements').insert({ school_id: cls.school_id, class_id: school ? null : St.cls, title: d.title.trim(), body: d.body.trim(), created_by: me.id }));
    if (d.push && !school) { try { const r = await fn('send-push', { class_id: St.cls, title: d.title.trim(), body: d.body.trim().slice(0, 120) }); toast(`Posted. ${r.sent} notification(s) sent.`); } catch (e) { toast('Posted, but notifications failed: ' + e.message, true); } } else toast('Posted.'); go(); },
  msg: async d => { const cls = St.classes.find(c => c.id === St.cls); must(await sb.from('messages').insert({ school_id: cls.school_id, sender_id: me.id, recipient_id: St.peer, body: d.body.trim() })); go(); },
  live: async d => { const qs = [], keys = []; d.qs.split('\n').map(l => l.trim()).filter(Boolean).forEach((l, i) => { const p = l.split('|').map(x => x.trim()); const k = 'ABCD'.indexOf((p[5] || '').toUpperCase()); if (p.length !== 6 || p.slice(0, 5).some(x => !x) || k < 0) throw new Error('Line ' + (i + 1) + ' is not in the form: Question | A | B | C | D | correct letter'); qs.push({ q: p[0], o: p.slice(1, 5) }); keys.push(k); });
    if (!qs.length || qs.length > 40) throw new Error('Add between 1 and 40 questions.');
    const code = Array.from(crypto.getRandomValues(new Uint8Array(6))).map(x => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x % 32]).join('');
    const s = must(await sb.from('live_sessions').insert({ class_id: St.cls, host_id: me.id, code, questions: qs }).select('id').single()); must(await sb.from('live_keys').insert({ session_id: s.id, answers: keys })); toast('Quiz ready. Code: ' + code); go(); },
  guardian: async d => { must(await sb.from('guardians').insert({ student_id: d.student_id, name: d.name || null, email: d.email.trim().toLowerCase(), digest_opt_in: !!d.consent, consent_at: d.consent ? new Date().toISOString() : null, created_by: me.id })); toast('Added.'); go(); },
  ai: async d => { must(await sb.from('schools').update({ ai_mode: d.ai_mode, ai_cap: d.ai_cap === '' ? null : +d.ai_cap, ai_period: d.ai_period }).eq('id', me.school_id)); toast('Saved.'); },
  bulk: async d => { const list = d.list.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const p = l.split(/\s+/); return { first_name: p[0], surname: p.slice(1).join(' ') }; });
    const r = await fn('bulk-create-students', { class_id: d.class_id, students: list }); const rows = r.results || r.created || [];
    $('#creds').innerHTML = `<h3>Login details. Print or copy now: passwords are shown only once.</h3>${table(['Name', 'Username', 'Temporary password', 'Student no.'], rows.map(x => `<tr><td>${esc(x.first_name + ' ' + x.surname)}</td><td>${esc(x.username || '')}</td><td>${esc(x.temp_password || x.error || '')}</td><td>${esc(x.student_number || '')}</td></tr>`))}<p class="noprint"><button class="g" onclick="window.print()">Print</button></p>`; toast('Done.'); },
  invite: async d => { const body = { first_name: d.first_name, surname: d.surname, email: d.email, role: d.role }; if (d.class_id && d.subject) body.assignments = [{ class_id: d.class_id, subject: d.subject }]; await fn('invite-staff', body); toast('Invitation sent.'); },
  class: async d => { must(await sb.from('classes').insert({ school_id: me.school_id, name: d.name.trim(), grade: d.grade.trim() })); toast('Class added.'); St.classes = must(await sb.from('classes').select('id,name,grade,school_id').eq('school_id', me.school_id).order('name')); go(); },
  school: async d => { await fn('create-school', { name: d.name, country_code: d.country_code, region: d.region, admin_first: d.admin_first, admin_surname: d.admin_surname, admin_email: d.admin_email }); toast('School created. The admin has been e-mailed.'); go(); },
  plan: async d => { must(await sb.from('plans').upsert({ code: d.code, name: d.name, country_code: d.country_code || null, currency_code: d.currency_code.toUpperCase(), amount_minor: Math.round(parseFloat(d.price) * 100), period: d.period, audience: d.audience, seats: +d.seats, active: true })); toast('Plan saved.'); go(); },
  promo: async d => { must(await sb.from('promo_codes').insert({ code: d.code, kind: d.kind, value: +d.value, max_uses: d.max_uses ? +d.max_uses : null, expires_at: d.expires_at ? d.expires_at + 'T23:59:59Z' : null })); toast('Code added.'); go(); },
  config: async d => { must(await sb.from('platform_config').update({ ai_default_cap: +d.ai_default_cap, trial_days: +d.trial_days, maintenance: !!d.maintenance, banner: d.banner || null, updated_at: new Date().toISOString() }).eq('id', 'global')); toast('Saved.'); }
};
document.addEventListener('click', guard(async e => {
  const t = e.target.closest('[data-tab]'); if (t) { St.tab = t.dataset.tab; St.asmt = St.task = St.live = ''; return go(); }
  const a = e.target.closest('[data-a]'); if (a && a.tagName !== 'SELECT' && A[a.dataset.a]) return A[a.dataset.a](a);
}));
document.addEventListener('change', guard(async e => {
  const t = e.target;
  if (t.matches('[data-cls]')) { St.cls = t.value; St.asmt = St.task = St.live = St.peer = ''; return go(); }
  if (t.matches('[data-day]')) { St.day = t.value || today(); return go(); }
  if (t.matches('[data-peer]')) { St.peer = t.value; return go(); }
  if (t.matches('select[data-a]') && A[t.dataset.a]) return A[t.dataset.a](t);
}));
document.addEventListener('submit', guard(async e => {
  const f = e.target.closest('form[data-f]'); if (!f) return; e.preventDefault();
  const d = {}; new FormData(f).forEach((v, k) => d[k] = v); f.querySelectorAll('input[type=checkbox]').forEach(c => d[c.name] = c.checked);
  const btn = f.querySelector('button.b'); if (btn) btn.disabled = true;
  try { await F[f.dataset.f](d, f); } finally { if (btn) btn.disabled = false; }
}));
guard(boot)();
})();
</script></body></html>
