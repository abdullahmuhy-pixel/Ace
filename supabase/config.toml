# Minimal config for `supabase link` / `db push` / `functions deploy`.
# Local-dev settings (ports etc.) are generated by `supabase init` if you want to run it locally.
project_id = "ace-education"

# These functions authenticate themselves (public ones are rate-limited, staff ones check the JWT inside),
# so the gateway JWT check is off.
[functions.join-school]
verify_jwt = false
[functions.signup-student]
verify_jwt = false
[functions.resolve-login]
verify_jwt = false
[functions.request-reset]
verify_jwt = false
[functions.reset-password]
verify_jwt = false
[functions.create-school]
verify_jwt = false
[functions.invite-staff]
verify_jwt = false
[functions.bulk-create-students]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
[functions.lookup-school]
verify_jwt = false
[functions.ai-tutor]
verify_jwt = false
[functions.checkout-start]
verify_jwt = false
[functions.payments-webhook]
verify_jwt = false
[functions.send-parent-digest]
verify_jwt = false
[functions.taught-today]
