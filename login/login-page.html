.or{display:flex;align-items:center;gap:10px;color:var(--text3);font-size:11px;margin:12px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}

.bk{border:0;background:none;color:var(--ink);font-weight:600;padding:0 0 10px}
.otp{letter-spacing:.5em;text-align:center;font-weight:700;font-size:22px}
.st{display:flex;gap:6px;justify-content:center;margin-bottom:14px}.st i{width:28px;height:4px;border-radius:9px;background:var(--border)}.st i.on{background:var(--primary)}
.done{text-align:center;padding:12px 0}.done .ic{font-size:44px}
.fine{font-size:12px;color:var(--text3);margin:0 0 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}

 else if(a=='su'){if(!v('fn').trim()||!v('sn').trim()||!v('un2').trim()||!v('gd')||!v('tx'))return go(()=>S.err=t.need);if(!v('em3').includes('@'))return go(()=>S.err=t.need);if(v('p2').length<8)return go(()=>S.err=t.e2);if(!$('#ag').checked)return go(()=>S.err=t.agE);

   sb(true);const {data,error}=await SB.auth.signInWithPassword({email:r.login_email,password:pw});if(error)throw new Error(error.message);
   await finish(data.user,false)})}
 else if(a=='sin'){if(!v('ae').includes('@')||!v('ap'))return go(()=>S.err=t.e1);

 else if(a=='fp1')go(()=>S.fp=1);
 else if(a=='fp2'){if(!v('em2').includes('@'))return go(()=>S.err=t.e1);

 else if(a=='cpw'){if(v('n1').length<8)return go(()=>S.err=t.e2);if(v('n1')!=v('n2'))return go(()=>S.err=t.mm);
  await run(async()=>{const {error}=await SB.auth.updateUser({password:v('n1'),data:{must_change_password:false}});if(error)throw new Error(error.message);

 else if(a=='out'){try{await SB.auth.signOut()}catch(x){}S.have=null;render()}
